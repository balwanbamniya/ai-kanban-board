# Render Blueprint. Secrets (sync: false) are entered in the dashboard.
services:
  - type: web
    name: ai-kanban-board
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @repo/api generate && pnpm --filter @repo/api build
    # Free plan has no preDeployCommand, so migrate on boot (idempotent).
    startCommand: pnpm --filter @repo/api db:migrate:deploy && pnpm --filter @repo/api start:prod
    healthCheckPath: /health/live
    envVars:
      - { key: NODE_VERSION, value: 24.20.0 }
      - { key: NODE_ENV, value: production }
      - { key: NODE_OPTIONS, value: --max-old-space-size=384 }
      - { key: LOG_LEVEL, value: warn }
      - { key: OTEL_ENABLED, value: "false" }
      - { key: DATABASE_POOL_MAX, value: "3" }
      - { key: DATABASE_URL, sync: false }
      - { key: REDIS_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
      - { key: CLERK_JWT_KEY, sync: false }
      - { key: CLERK_WEBHOOK_SIGNING_SECRET, sync: false }
      - { key: CLERK_AUTHORIZED_PARTIES, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: OPENAI_MODEL, sync: false }
  - type: web
    name: ai-kanban-board-front
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @repo/frontend build
    startCommand: pnpm --filter @repo/frontend start
    envVars:
      - { key: NODE_VERSION, value: 24.20.0 }
      - { key: NODE_OPTIONS, value: --max-old-space-size=384 }
      - { key: VITE_API_BASE_URL, sync: false }
      - { key: VITE_CLERK_PUBLISHABLE_KEY, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
