packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  lightningcss: true
  prisma: true
  protobufjs: false

catalog:
  "@types/node": 24.13.3
  typescript: 6.0.3
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.11'
  - '@biomejs/cli-darwin-arm64@2.5.11'
  - '@biomejs/cli-darwin-x64@2.5.11'
  - '@biomejs/cli-linux-arm64-musl@2.5.11'
  - '@biomejs/cli-linux-arm64@2.5.11'
  - '@biomejs/cli-linux-x64-musl@2.5.11'
  - '@biomejs/cli-linux-x64@2.5.11'
  - '@biomejs/cli-win32-arm64@2.5.11'
  - '@biomejs/cli-win32-x64@2.5.11'
  - '@nestjs/cli@12.0.0'
  - '@nestjs/common@12.0.1'
  - '@nestjs/core@12.0.1'
  - '@nestjs/platform-express@12.0.1'
  - '@nestjs/schematics@12.0.0'
  - '@nestjs/testing@12.0.1'
  - '@testing-library/react@16.3.3'
  - '@vitejs/plugin-react@6.1.1'
  - '@nestjs/swagger@12.0.1'

overrides:
  # Prisma 7.10 pins vulnerable deepmerge-ts 7.1.5 (GHSA-ggr8-5vv4-36mx).
  deepmerge-ts: 8.0.2
