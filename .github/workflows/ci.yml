name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://ai_kanban:ai_kanban@localhost:5432/ai_kanban?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_kanban
          POSTGRES_PASSWORD: ai_kanban
          POSTGRES_USER: ai_kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_kanban -d ai_kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate database schema
        run: pnpm --filter @repo/api db:validate

      - name: Generate database client
        run: pnpm generate

      - name: Apply database migrations
        run: pnpm --filter @repo/api db:migrate:deploy

      - name: Seed database
        run: pnpm --filter @repo/api db:seed

      - name: Verify idempotent database seed
        run: pnpm --filter @repo/api db:seed

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Check formatting and linting
        run: pnpm check

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build
